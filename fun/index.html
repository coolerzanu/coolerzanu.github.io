<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prak.fun</title>
<meta name="description" content="Small games, built from scratch by Prakshab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0c;
    --fg: #e8e6df;
    --dim: #6f6c63;
    --accent: #7cfc9a;
    --card: #151512;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f1e8;
      --fg: #1b1a17;
      --dim: #8a8578;
      --accent: #1f7a3a;
      --card: #ebe7dc;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 16px 32px;
  }
  a { color: inherit; }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 48px; max-width: 100%; }
  #logo {
    font-family: inherit;
    font-size: clamp(7px, 2.4vw, 22px);
    font-weight: 700;
    line-height: 1.15;
    color: var(--accent);
    display: inline-block;
    text-align: left;
    white-space: pre;
    user-select: none;
  }
  .tag { margin-top: 20px; color: var(--dim); }
  .cursor { animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  .status {
    margin-top: 6px;
    font-size: 13px;
    color: var(--dim);
  }
  .status b { color: var(--fg); font-weight: 400; }

  /* ---------- grid ---------- */
  main { width: 100%; max-width: 960px; }
  .divider {
    color: var(--dim);
    overflow: hidden;
    white-space: nowrap;
    margin-bottom: 24px;
    user-select: none;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px;
    background: var(--card);
    border: 1px dashed var(--dim);
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  /* "+" corners so every card looks hand-drawn in ASCII */
  .card::before, .card::after {
    content: "+";
    position: absolute;
    color: var(--dim);
    line-height: 1;
    font-size: 14px;
  }
  .card::before { top: -8px; left: -5px; }
  .card::after  { bottom: -8px; right: -5px; }

  .card:hover, .card:focus-visible {
    transform: translate(-3px, -3px);
    border-color: var(--accent);
    border-style: solid;
    box-shadow: 3px 3px 0 var(--accent);
    outline: none;
  }
  .card:hover::before, .card:hover::after { color: var(--accent); }

  .icon {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.2;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .card h2 { font-size: 16px; font-weight: 700; }
  .card p { font-size: 13px; color: var(--dim); flex: 1; }
  .badge { font-size: 12px; color: var(--dim); }
  .card:hover .badge { color: var(--accent); }

  .soon .icon { opacity: .55; }
  .shake { animation: shake .3s; }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------- footer ---------- */
  footer {
    margin-top: 64px;
    text-align: center;
    font-size: 13px;
    color: var(--dim);
  }
  footer a { color: var(--fg); text-decoration: none; border-bottom: 1px dashed var(--dim); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  footer p + p { margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <pre id="logo" aria-label="Prak.fun"></pre>
  <p class="tag">&gt; games<span class="cursor">_</span></p>
</header>

<main>
  <div class="divider" aria-hidden="true">=================================================================================================================================</div>
  <div id="grid"></div>
</main>

<footer>
  <p><a href="/">&lt;- back to prakshab's site</a></p>
</footer>

<script>
  /* ============================================================
     GAMES — add a new game here. Set status: "live" and an href
     once it's built (e.g. href: "snake/").
     ============================================================ */
  const GAMES = [
    {
      title: "minesweeper",
      desc: "three difficulties.",
      status: "live",
      href: "minesweeper/",
      icon:
`+---------+
| 1 1 2 # |
| 1 * 2 # |
| 1 1 2 # |
+---------+`
    },
    {
      title: "game of life",
      desc: "conway's cellular automaton.",
      status: "live",
      href: "life/",
      icon:
`+---------+
|  .#.    |
|  ..#    |
|  ###    |
+---------+`
    },
    {
      title: "fractal explorer",
      desc: "mandelbrot, julia, burning ship, tricorn.",
      status: "live",
      href: "fractal/",
      icon:
`+---------+
|   .:#:  |
| .:####: |
|   ':#:  |
+---------+`
    },
  ];

  /* ---------- logo: block letters built from a tiny pixel font ---------- */
  // figlet "standard"-style letters — plain ASCII only, so every
  // monospace font lines them up perfectly
  const GLYPHS = {
    P: [" ____  ", "|  _ \\ ", "| |_) |", "|  __/ ", "|_|    "],
    R: [" ____  ", "|  _ \\ ", "| |_) |", "|  _ < ", "|_| \\_\\"],
    A: ["    _    ", "   / \\   ", "  / _ \\  ", " / ___ \\ ", "/_/   \\_\\"],
    K: [" _  __", "| |/ /", "| ' / ", "| . \\ ", "|_|\\_\\"],
    ".": ["   ", "   ", "   ", " _ ", "(_)"],
    F: [" _____ ", "|  ___|", "| |_   ", "|  _|  ", "|_|    "],
    U: [" _   _ ", "| | | |", "| | | |", "| |_| |", " \\___/ "],
    N: [" _   _ ", "| \\ | |", "|  \\| |", "| |\\  |", "|_| \\_|"]
  };
  const WORD = "PRAK.FUN";

  function buildLogo() {
    const rows = ["", "", "", "", ""];
    for (const ch of WORD) {
      const g = GLYPHS[ch];
      const w = Math.max(...g.map(s => s.length));
      for (let r = 0; r < 5; r++) rows[r] += g[r].padEnd(w) + " ";
    }
    return rows.map(r => r.trimEnd()).join("\n");
  }

  /* ---------- logo "decode" animation ---------- */
  const logo = document.getElementById("logo");
  const finalLogo = buildLogo();
  const NOISE = "#@%&$*+=?";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduceMotion) {
    logo.textContent = finalLogo;
  } else {
    const lines = finalLogo.split("\n");
    const width = Math.max(...lines.map(l => l.length));
    const TOTAL = 40;
    let frame = 0;
    (function tick() {
      frame++;
      logo.textContent = lines.map(line =>
        [...line].map((c, i) => {
          if (c === " ") return c;
          const revealAt = (i / width) * TOTAL * 0.8 + 4;
          return frame > revealAt ? c : NOISE[(Math.random() * NOISE.length) | 0];
        }).join("")
      ).join("\n");
      if (frame < TOTAL + 4) requestAnimationFrame(tick);
      else logo.textContent = finalLogo;
    })();
  }

  /* ---------- game cards ---------- */
  const grid = document.getElementById("grid");
  GAMES.forEach(game => {
    const live = game.status === "live";
    const el = document.createElement(live ? "a" : "div");
    el.className = "card" + (live ? "" : " soon");
    el.tabIndex = 0;
    if (live) el.href = game.href;

    const icon = document.createElement("pre");
    icon.className = "icon";
    icon.textContent = game.icon;

    const h2 = document.createElement("h2");
    h2.textContent = game.title;

    const p = document.createElement("p");
    p.textContent = game.desc;

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = live ? "[ play -> ]" : "[ coming soon ]";

    el.append(icon, h2, p, badge);

    if (!live) {
      el.addEventListener("click", () => {
        el.classList.remove("shake");
        void el.offsetWidth; // restart the animation
        el.classList.add("shake");
      });
    }
    grid.appendChild(el);
  });
</script>
<!-- ============================================================
     THE CRACK — a secret way into the ASCII Archive (archive/).
     Click the top-right corner a few times to break through.
     Self-contained: delete this whole block to remove it.
     ============================================================ -->
<style>
  #rift {
    position: absolute; top: 0; right: 0; width: 96px; height: 96px;
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer; z-index: 50;
    -webkit-tap-highlight-color: transparent;
  }
  #rift:focus-visible { outline: 1px dashed var(--accent); outline-offset: -8px; }
  #rift svg { position: absolute; top: 0; right: 0; width: 320px; height: 320px; overflow: visible; pointer-events: none; }
  #rift .c {
    fill: none; stroke: var(--fg); stroke-linecap: round; stroke-linejoin: round; opacity: .5;
    transition: stroke-dashoffset .5s cubic-bezier(.2, .8, .2, 1), opacity .3s;
  }
  #rift .g {
    fill: none; stroke: var(--accent); stroke-linecap: round; opacity: 0;
    transition: stroke-dashoffset .5s cubic-bezier(.2, .8, .2, 1), opacity .8s;
  }
  #rift:hover .c, #rift:focus-visible .c { opacity: .85; }
  #rift-whisper {
    position: absolute; top: 18px; right: 108px; z-index: 50;
    font-size: 12px; color: var(--dim); white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .6s;
  }
  #rift-whisper.show { opacity: 1; }
  .rift-shard {
    position: fixed; z-index: 1001; pointer-events: none; left: 0; top: 0;
    color: var(--fg); font-size: 13px; font-weight: 700; will-change: transform, opacity;
  }
  body.rift-jolt { animation: rift-jolt .3s; }
  @keyframes rift-jolt {
    20% { transform: translate(3px, -2px); } 45% { transform: translate(-4px, 2px); }
    70% { transform: translate(2px, 1px); }
  }
  #rift-break { position: fixed; inset: 0; z-index: 1000; background: transparent; transition: background 1s ease; }
  #rift-break.dark { background: #000; }
  #rift-break svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 1.2s ease; }
  #rift-break .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; }
  #rift-break iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #000; opacity: 0; transition: opacity 1.4s ease;
  }
  #rift-break iframe.in { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    #rift .c, #rift .g { transition: none; }
    body.rift-jolt { animation: none; }
  }
</style>
<button id="rift" aria-label="There is a crack in the corner. Click it a few times."></button>
<div id="rift-whisper" aria-live="polite"></div>
<script>
(() => {
  const TARGET = "archive/";                       // where the crack leads
  const STAGES = 4;                                // clicks to break through
  const WHISPERS = ["", "hm.", "it's hollow.", "one more."];
  const REACH = [30, 60, 115, 185, 9999];          // how far the crack has spread per stage
  const GLOW = [0, .25, .5, .85, 1];
  const SVGNS = "http://www.w3.org/2000/svg";
  const rift = document.getElementById("rift");
  const whisper = document.getElementById("rift-whisper");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const quiet = p => { if (p && p.catch) p.catch(() => {}); };

  /* ---- a branching crack, grown from one point with a seeded random walk ---- */
  function crack(seed, ox, oy, branches, reach, step) {
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const segs = [];
    function grow(x, y, ang, len, dist, depth, bi) {
      const n = Math.max(2, Math.round(len / step));
      for (let i = 0; i < n; i++) {
        ang += (rand() - .5) * .8;
        const l = step * (.55 + rand() * .9), nx = x + Math.cos(ang) * l, ny = y + Math.sin(ang) * l;
        segs.push({ bi, x1: x, y1: y, x2: nx, y2: ny, d: dist, len: l, w: Math.max(.55, 2.4 - depth * .7 - dist / reach * 1.4) });
        x = nx; y = ny; dist += l;
        if (depth < 2 && rand() < .26) grow(x, y, ang + (rand() < .5 ? -1 : 1) * (.45 + rand() * .7), len * (.3 + rand() * .3), dist, depth + 1, bi);
      }
    }
    for (let b = 0; b < branches; b++) {
      const ang = Math.PI * (.52 + .5 * (b + rand() * .6) / branches);   // fan down and to the left
      grow(ox, oy, ang, reach * (.55 + rand() * .45), 0, 0, b);
    }
    return segs;
  }
  const line = (s, cls, extraW) => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", `M${s.x1.toFixed(1)} ${s.y1.toFixed(1)}L${s.x2.toFixed(1)} ${s.y2.toFixed(1)}`);
    p.setAttribute("class", cls);
    p.style.strokeWidth = s.w + extraW;
    p.style.strokeDasharray = s.len + 1;
    p.style.strokeDashoffset = s.len + 1;
    return p;
  };

  /* ---- the small crack in the corner ---- */
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 320 320");
  svg.setAttribute("aria-hidden", "true");
  const blur = document.createElementNS(SVGNS, "filter");
  blur.id = "rift-blur"; blur.innerHTML = '<feGaussianBlur stdDeviation="2.4"/>';
  svg.appendChild(blur);
  const segs = crack(7, 292, 28, 4, 210, 15);
  const glows = segs.map(s => { const p = line(s, "g", 2.5); p.setAttribute("filter", "url(#rift-blur)"); svg.appendChild(p); return p; });
  const lines = segs.map(s => { const p = line(s, "c", 0); svg.appendChild(p); return p; });
  rift.appendChild(svg);

  let stage = 0, broken = false;
  try { if (localStorage.getItem("rift-open") === "1") stage = STAGES - 1; } catch (e) {}
  function render() {
    const reach = REACH[stage];
    segs.forEach((s, i) => {
      // before the first click only one thin fracture shows, so it reads as damage, not an icon
      const show = stage === 0 ? (s.bi === 1 && s.d < reach) : s.d < reach;
      const off = show ? 0 : s.len + 1;
      lines[i].style.strokeDashoffset = off;
      glows[i].style.strokeDashoffset = off;
      glows[i].style.opacity = GLOW[stage];
    });
  }
  render();

  /* ---- sound: a synthesized crack (the click allows audio) ---- */
  let ac = null;
  function crackSound(power) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      quiet(ac.resume());
      const t = ac.currentTime, sr = ac.sampleRate, dur = .2 + power * .25;
      const buf = ac.createBuffer(1, sr * dur, sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3 - power * .4);
      const src = ac.createBufferSource(); src.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400 - power * 350; bp.Q.value = .7;
      const g = ac.createGain(); g.gain.value = .22 + power * .1;
      src.connect(bp).connect(g).connect(ac.destination); src.start(t);
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(32, t + .25 + power * .2);
      og.gain.setValueAtTime(.15 + power * .12, t); og.gain.exponentialRampToValueAtTime(.0001, t + .3 + power * .4);
      o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 1.2);
    } catch (e) {}
  }

  /* ---- falling ascii shards ---- */
  function shards(n, x0, y0, spread) {
    if (reduce) return;
    const CH = "/\\|_-.,'`;:";
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span");
      el.className = "rift-shard";
      el.textContent = CH[(Math.random() * CH.length) | 0];
      document.body.appendChild(el);
      let x = x0 - Math.random() * spread, y = y0 + Math.random() * spread * .6;
      let vx = (Math.random() - .7) * 2.2, vy = -Math.random() * 2.5, r = 0, vr = (Math.random() - .5) * 18, a = 1;
      const tick = () => {
        vy += .32; x += vx; y += vy; r += vr; a -= .014;
        el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
        el.style.opacity = a;
        if (a > 0 && y < innerHeight + 20) requestAnimationFrame(tick); else el.remove();
      };
      requestAnimationFrame(tick);
    }
  }
  function jolt() {
    document.body.classList.remove("rift-jolt"); void document.body.offsetWidth;
    document.body.classList.add("rift-jolt");
  }
  function say(text) {
    whisper.textContent = text;
    whisper.classList.toggle("show", !!text);
  }

  rift.addEventListener("click", () => {
    if (broken) return;
    crackSound(stage);
    stage++;
    jolt();
    const box = rift.getBoundingClientRect();
    shards(3 + stage * 4, box.right - 30, box.top + 30, 40 + stage * 25);
    if (stage >= STAGES) { breakThrough(); return; }
    render();
    say(WHISPERS[stage] || "");
  });

  /* ---- breaking through: the crack takes the screen, then the archive fades in ---- */
  let overlay = null, oldTitle = document.title;
  function breakThrough() {
    broken = true; say("");
    try { localStorage.setItem("rift-open", "1"); } catch (e) {}
    stage = STAGES; render();
    crackSound(4);

    // fullscreen needs a click — this one counts
    const root = document.documentElement, fs = root.requestFullscreen || root.webkitRequestFullscreen;
    if (fs) try { quiet(fs.call(root)); } catch (e) {}

    overlay = document.createElement("div");
    overlay.id = "rift-break";
    overlay.setAttribute("data-fs-host", "");
    const W = innerWidth, H = innerHeight, box = rift.getBoundingClientRect();
    const big = document.createElementNS(SVGNS, "svg");
    big.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const bf = document.createElementNS(SVGNS, "filter");
    bf.id = "rift-blur-big"; bf.innerHTML = '<feGaussianBlur stdDeviation="3"/>';
    big.appendChild(bf);
    const huge = crack(11, box.right - 28, box.top + 28, 8, Math.hypot(W, H) * 1.05, 26);
    const paths = [];
    huge.forEach(s => {
      const gl = line(s, "", 4); gl.setAttribute("filter", "url(#rift-blur-big)");
      gl.style.stroke = "var(--accent)"; gl.style.fill = "none"; gl.style.opacity = .9;
      const ln = line(s, "", .6); ln.style.stroke = "var(--fg)"; ln.style.fill = "none";
      [gl, ln].forEach(p => {
        p.style.strokeLinecap = "round";
        p.style.transition = reduce ? "none" : `stroke-dashoffset .12s linear ${(s.d / 2600).toFixed(3)}s`;
        big.appendChild(p); paths.push(p);
      });
    });
    const flash = document.createElement("div"); flash.className = "flash";
    const frame = document.createElement("iframe");
    frame.src = TARGET; frame.title = "The ASCII Archive";
    frame.setAttribute("allow", "autoplay; fullscreen");
    overlay.append(frame, big, flash);
    document.body.appendChild(overlay);

    requestAnimationFrame(() => requestAnimationFrame(() => paths.forEach(p => p.style.strokeDashoffset = 0)));
    if (!reduce) flash.animate([{ opacity: 0 }, { opacity: .35, offset: .15 }, { opacity: 0 }], { duration: 700, easing: "ease-out" });
    shards(40, box.right - 30, box.top + 30, 220);

    try { history.pushState({ rift: true }, "", TARGET); } catch (e) {}
    document.title = "The ASCII Archive";
    setTimeout(() => overlay && overlay.classList.add("dark"), reduce ? 0 : 750);
    setTimeout(() => {
      if (!overlay) return;
      frame.classList.add("in"); big.style.opacity = 0;
      try { frame.focus(); } catch (e) {}
    }, reduce ? 200 : 1500);
  }

  // the back button closes the archive and returns to Prak.fun
  addEventListener("popstate", () => {
    if (!overlay) return;
    overlay.remove(); overlay = null;
    document.title = oldTitle;
    const doc = document, ex = doc.exitFullscreen || doc.webkitExitFullscreen;
    if ((doc.fullscreenElement || doc.webkitFullscreenElement) && ex) try { quiet(ex.call(doc)); } catch (e) {}
    broken = false; stage = STAGES - 1; render(); say("one more.");
  });
})();
</script>
</body>
</html>
