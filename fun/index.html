<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prak.fun</title>
<meta name="description" content="Small games, built from scratch by Prakshab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0c;
    --fg: #e8e6df;
    --dim: #6f6c63;
    --accent: #7cfc9a;
    --card: #151512;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f1e8;
      --fg: #1b1a17;
      --dim: #8a8578;
      --accent: #1f7a3a;
      --card: #ebe7dc;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 16px 32px;
  }
  a { color: inherit; }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 48px; max-width: 100%; }
  #logo {
    font-family: inherit;
    font-size: clamp(7px, 2.4vw, 22px);
    font-weight: 700;
    line-height: 1.15;
    color: var(--accent);
    display: inline-block;
    text-align: left;
    white-space: pre;
    user-select: none;
  }
  .tag { margin-top: 20px; color: var(--dim); }
  .cursor { animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  .status {
    margin-top: 6px;
    font-size: 13px;
    color: var(--dim);
  }
  .status b { color: var(--fg); font-weight: 400; }

  /* ---------- grid ---------- */
  main { width: 100%; max-width: 960px; }
  .divider {
    color: var(--dim);
    overflow: hidden;
    white-space: nowrap;
    margin-bottom: 24px;
    user-select: none;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px;
    background: var(--card);
    border: 1px dashed var(--dim);
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  /* "+" corners so every card looks hand-drawn in ASCII */
  .card::before, .card::after {
    content: "+";
    position: absolute;
    color: var(--dim);
    line-height: 1;
    font-size: 14px;
  }
  .card::before { top: -8px; left: -5px; }
  .card::after  { bottom: -8px; right: -5px; }

  .card:hover, .card:focus-visible {
    transform: translate(-3px, -3px);
    border-color: var(--accent);
    border-style: solid;
    box-shadow: 3px 3px 0 var(--accent);
    outline: none;
  }
  .card:hover::before, .card:hover::after { color: var(--accent); }

  .icon {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.2;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .card h2 { font-size: 16px; font-weight: 700; }
  .card p { font-size: 13px; color: var(--dim); flex: 1; }
  .badge { font-size: 12px; color: var(--dim); }
  .card:hover .badge { color: var(--accent); }

  .soon .icon { opacity: .55; }
  .shake { animation: shake .3s; }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------- footer ---------- */
  footer {
    margin-top: 64px;
    text-align: center;
    font-size: 13px;
    color: var(--dim);
  }
  footer a { color: var(--fg); text-decoration: none; border-bottom: 1px dashed var(--dim); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  footer p + p { margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <pre id="logo" aria-label="Prak.fun"></pre>
  <p class="tag">&gt; games<span class="cursor">_</span></p>
</header>

<main>
  <div class="divider" aria-hidden="true">=================================================================================================================================</div>
  <div id="grid"></div>
</main>

<footer>
  <p><a href="/">&lt;- back to prakshab's site</a></p>
</footer>

<script>
  /* ============================================================
     GAMES — add a new game here. Set status: "live" and an href
     once it's built (e.g. href: "snake/").
     ============================================================ */
  const GAMES = [
    {
      title: "minesweeper",
      desc: "three difficulties.",
      status: "live",
      href: "minesweeper/",
      icon:
`+---------+
| 1 1 2 # |
| 1 * 2 # |
| 1 1 2 # |
+---------+`
    },
    {
      title: "game of life",
      desc: "conway's cellular automaton.",
      status: "live",
      href: "life/",
      icon:
`+---------+
|  .#.    |
|  ..#    |
|  ###    |
+---------+`
    },
    {
      title: "fractal explorer",
      desc: "mandelbrot, julia, burning ship, tricorn.",
      status: "live",
      href: "fractal/",
      icon:
`+---------+
|   .:#:  |
| .:####: |
|   ':#:  |
+---------+`
    },
  ];

  /* ---------- logo: block letters built from a tiny pixel font ---------- */
  // figlet "standard"-style letters — plain ASCII only, so every
  // monospace font lines them up perfectly
  const GLYPHS = {
    P: [" ____  ", "|  _ \\ ", "| |_) |", "|  __/ ", "|_|    "],
    R: [" ____  ", "|  _ \\ ", "| |_) |", "|  _ < ", "|_| \\_\\"],
    A: ["    _    ", "   / \\   ", "  / _ \\  ", " / ___ \\ ", "/_/   \\_\\"],
    K: [" _  __", "| |/ /", "| ' / ", "| . \\ ", "|_|\\_\\"],
    ".": ["   ", "   ", "   ", " _ ", "(_)"],
    F: [" _____ ", "|  ___|", "| |_   ", "|  _|  ", "|_|    "],
    U: [" _   _ ", "| | | |", "| | | |", "| |_| |", " \\___/ "],
    N: [" _   _ ", "| \\ | |", "|  \\| |", "| |\\  |", "|_| \\_|"]
  };
  const WORD = "PRAK.FUN";

  function buildLogo() {
    const rows = ["", "", "", "", ""];
    for (const ch of WORD) {
      const g = GLYPHS[ch];
      const w = Math.max(...g.map(s => s.length));
      for (let r = 0; r < 5; r++) rows[r] += g[r].padEnd(w) + " ";
    }
    return rows.map(r => r.trimEnd()).join("\n");
  }

  /* ---------- logo "decode" animation ---------- */
  const logo = document.getElementById("logo");
  const finalLogo = buildLogo();
  const NOISE = "#@%&$*+=?";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduceMotion) {
    logo.textContent = finalLogo;
  } else {
    const lines = finalLogo.split("\n");
    const width = Math.max(...lines.map(l => l.length));
    const TOTAL = 40;
    let frame = 0;
    (function tick() {
      frame++;
      logo.textContent = lines.map(line =>
        [...line].map((c, i) => {
          if (c === " ") return c;
          const revealAt = (i / width) * TOTAL * 0.8 + 4;
          return frame > revealAt ? c : NOISE[(Math.random() * NOISE.length) | 0];
        }).join("")
      ).join("\n");
      if (frame < TOTAL + 4) requestAnimationFrame(tick);
      else logo.textContent = finalLogo;
    })();
  }

  /* ---------- game cards ---------- */
  const grid = document.getElementById("grid");
  GAMES.forEach(game => {
    const live = game.status === "live";
    const el = document.createElement(live ? "a" : "div");
    el.className = "card" + (live ? "" : " soon");
    el.tabIndex = 0;
    if (live) el.href = game.href;

    const icon = document.createElement("pre");
    icon.className = "icon";
    icon.textContent = game.icon;

    const h2 = document.createElement("h2");
    h2.textContent = game.title;

    const p = document.createElement("p");
    p.textContent = game.desc;

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = live ? "[ play -> ]" : "[ coming soon ]";

    el.append(icon, h2, p, badge);

    if (!live) {
      el.addEventListener("click", () => {
        el.classList.remove("shake");
        void el.offsetWidth; // restart the animation
        el.classList.add("shake");
      });
    }
    grid.appendChild(el);
  });
</script>
<!-- ============================================================
     THE CRACK — a secret way into the ASCII Archive (archive/).
     Click the top-right corner a few times to break through.
     Self-contained: delete this whole block to remove it.
     ============================================================ -->
<style>
  #rift {
    position: absolute; top: 0; right: 0; z-index: 50;
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    color: inherit; -webkit-tap-highlight-color: transparent;
  }
  #rift:focus-visible { outline: 1px dashed var(--accent); outline-offset: -4px; }
  #rift pre {
    margin: 0; padding: 8px 10px 0 0; pointer-events: none; text-align: left;
    font: 700 14px/1 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color: var(--dim); white-space: pre;
  }
  #rift pre .k { color: var(--fg); opacity: .7; transition: opacity .3s; }
  #rift pre .l { color: var(--accent); }
  #rift:hover pre .k, #rift:focus-visible pre .k { opacity: 1; }
  #rift-whisper {
    position: absolute; top: 12px; z-index: 50;
    font-size: 12px; color: var(--dim); white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .6s;
  }
  #rift-whisper.show { opacity: 1; }
  body.rift-jolt { animation: rift-jolt .25s; }
  @keyframes rift-jolt {
    25% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 75% { transform: translate(1px, 0); }
  }
  #rift-break { position: fixed; inset: 0; z-index: 1000; background: transparent; transition: background .4s; }
  #rift-break.dark { background: #000; }
  #rift-break canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #rift-break iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #000; opacity: 0; transition: opacity 1.2s ease;
  }
  #rift-break iframe.in { opacity: 1; }
  #rift-break .msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 14px/1.7 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color: #7cfc9a; text-align: center; white-space: pre; opacity: 0; transition: opacity .6s;
  }
  #rift-break .msg a { color: #e8e6df; }
  @media (prefers-reduced-motion: reduce) { body.rift-jolt { animation: none; } }
</style>
<button id="rift" aria-label="There is a crack in the corner. Click it a few times."><pre aria-hidden="true"></pre></button>
<div id="rift-whisper" aria-live="polite"></div>
<script>
(() => {
  const TARGET = "archive/";                       // where the crack leads
  // resolve once, now: after the address bar changes, "archive/" would point somewhere else
  const TARGET_URL = new URL(TARGET, location.href).href, HOME_URL = location.href.split("#")[0];
  const STAGES = 4;                                // clicks to break through
  const WHISPERS = ["", "hm.", "it's hollow.", "one more."];
  const REACH = [3, 7, 12, 19];                    // how far the corner crack has spread per stage
  const LIGHT = [0, .12, .26, .45];                // how much light leaks through per stage
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const rift = document.getElementById("rift"), pre = rift.querySelector("pre");
  const whisper = document.getElementById("rift-whisper");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const quiet = p => { if (p && p.catch) p.catch(() => {}); };
  const seeded = s => () => (s = (s * 16807) % 2147483647) / 2147483647;

  /* ---------- the corner crack: an ascii fracture on a small grid ---------- */
  const GW = 22, GH = 11, grid = new Array(GW * GH).fill(null);   // {ch, t}
  (() => {
    const rand = seeded(29);
    const MOVES = [[-1, 1, "/"], [-1, 0, "_"], [0, 1, "|"], [1, 1, "\\"]];
    const pick = w => { let r = rand() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return MOVES[i]; return MOVES[0]; };
    function walk(x, y, t, len, w, depth) {
      for (let i = 0; i < len; i++) {
        const [dx, dy, ch] = pick(w);
        x += dx; y += dy;
        if (x < 0 || y < 0 || x >= GW || y >= GH) return;
        const k = y * GW + x;
        if (!grid[k] || grid[k].t > t) grid[k] = { ch, t };
        t++;
        if (depth < 1 && i > 1 && rand() < .2) walk(x, y, t, (len - i) * .6 | 0, [.3, .15, .45, .1], depth + 1);
      }
    }
    walk(GW, -1, 0, 20, [.5, .28, .16, .06], 0);    // main fracture, heading down-left
    walk(GW, -1, 2, 11, [.25, .1, .5, .15], 0);     // a second one, more downward
  })();
  // light can only leak out right next to the fracture
  const lightCells = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (grid[y * GW + x]) continue;
    let t = 1e9;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const g = grid[(y + dy) * GW + (x + dx)];
      if (x + dx >= 0 && x + dx < GW && y + dy >= 0 && g) t = Math.min(t, g.t);
    }
    if (t < 1e9) lightCells.push({ k: y * GW + x, t });
  }

  let stage = 0, broken = false, flicker = 0;
  try { if (localStorage.getItem("rift-open") === "1") stage = STAGES - 1; } catch (e) {}
  function drawCorner() {
    const reach = REACH[Math.min(stage, STAGES - 1)], lit = new Map();
    if (!reduce || stage > 0) for (const c of lightCells)
      if (c.t < reach - 1 && Math.random() < LIGHT[Math.min(stage, STAGES - 1)]) lit.set(c.k, ".:'`*"[(Math.random() * 5) | 0]);
    let out = "";
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        const k = y * GW + x, g = grid[k];
        if (g && g.t < reach) out += `<span class="k">${g.ch}</span>`;
        else if (lit.has(k)) out += `<span class="l">${lit.get(k)}</span>`;
        else out += " ";
      }
      out += "\n";
    }
    pre.innerHTML = out;
  }
  function setFlicker() {
    clearInterval(flicker);
    if (stage > 0 && !broken && !reduce) flicker = setInterval(drawCorner, 150);
  }
  drawCorner(); setFlicker();

  const say = text => {
    whisper.style.right = (rift.offsetWidth + 6) + "px";
    whisper.textContent = text;
    whisper.classList.toggle("show", !!text);
  };
  function jolt() {
    if (reduce) return;
    document.body.classList.remove("rift-jolt"); void document.body.offsetWidth;
    document.body.classList.add("rift-jolt");
  }

  /* ---------- sound (each click allows audio) ---------- */
  let ac = null;
  function crackSound(power, when = 0, gain = 1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      quiet(ac.resume());
      const t = ac.currentTime + when, sr = ac.sampleRate, dur = .12 + power * .08;
      const buf = ac.createBuffer(1, Math.ceil(sr * dur), sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
      const src = ac.createBufferSource(); src.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600 - power * 300; bp.Q.value = .8;
      const g = ac.createGain(); g.gain.value = (.18 + power * .06) * gain;
      src.connect(bp).connect(g).connect(ac.destination); src.start(t);
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(35, t + .2);
      og.gain.setValueAtTime((.08 + power * .05) * gain, t); og.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(og).connect(ac.destination); o.start(t); o.stop(t + .35);
    } catch (e) {}
  }
  function rumble() {
    try {
      const t = ac.currentTime, sr = ac.sampleRate, buf = ac.createBuffer(1, sr * 2, sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
      const src = ac.createBufferSource(); src.buffer = buf;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
      const g = ac.createGain(); g.gain.value = .5;
      src.connect(lp).connect(g).connect(ac.destination); src.start(t);
    } catch (e) {}
  }

  rift.addEventListener("click", () => {
    if (broken) return;
    crackSound(stage);
    stage++;
    jolt();
    if (stage >= STAGES) { breakThrough(); return; }
    drawCorner(); setFlicker();
    say(WHISPERS[stage] || "");
  });

  /* ---------- breaking through ---------- */
  let overlay = null;
  const oldTitle = document.title;

  function breakThrough() {
    broken = true; clearInterval(flicker); say("");
    try { localStorage.setItem("rift-open", "1"); } catch (e) {}
    stage = STAGES; drawCorner();
    // go fullscreen first (this click allows it), then shatter once the screen has settled
    let started = false;
    const begin = () => { if (!started) { started = true; shatterScreen(); } };
    const root = document.documentElement, fs = root.requestFullscreen || root.webkitRequestFullscreen;
    if (fs && !reduce) {
      try { const p = fs.call(root); if (p && p.then) p.then(() => setTimeout(begin, 150), begin); else setTimeout(begin, 250); }
      catch (e) { begin(); }
      setTimeout(begin, 700);
    } else begin();
  }

  function shatterScreen() {
    overlay = document.createElement("div");
    overlay.id = "rift-break";
    overlay.setAttribute("data-fs-host", "");
    document.body.appendChild(overlay);
    try { history.pushState({ rift: true }, "", TARGET_URL); } catch (e) {}
    document.title = "The ASCII Archive";
    if (reduce) return openArchive();

    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    const cv = document.createElement("canvas");
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    overlay.appendChild(cv);
    const c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.font = `700 14px ${MONO}`; c.textBaseline = "top";
    const cw = c.measureText("M").width, lh = 17;
    const cols = Math.ceil(W / cw), rows = Math.ceil(H / lh), n = cols * rows;
    const ox = W - 2 * cw, oy = lh, maxD = Math.hypot(W, H);
    const rand = seeded(1 + (Math.random() * 1e6 | 0));

    // shards: a voronoi of seed points, denser near the corner
    const seeds = [];
    for (let i = 0; i < 22; i++) {
      const r = Math.pow(rand(), 1.3) * maxD * .95, a = Math.PI * (.5 + rand() * .5) + (rand() - .5) * .3;
      seeds.push([ox + Math.cos(a) * r, oy + Math.sin(a) * r]);
    }
    for (let i = 0; i < 6; i++) seeds.push([rand() * W, rand() * H]);
    const owner = new Uint8Array(n), crackCh = new Uint16Array(n), crackT = new Float32Array(n), noise = new Float32Array(n);
    for (let r = 0, i = 0; r < rows; r++) for (let q = 0; q < cols; q++, i++) {
      const x = (q + .5) * cw, y = (r + .5) * lh;
      let best = 0, bd = 1e18;
      for (let s = 0; s < seeds.length; s++) { const dx = x - seeds[s][0], dy = y - seeds[s][1], d = dx * dx + dy * dy; if (d < bd) { bd = d; best = s; } }
      owner[i] = best; noise[i] = rand();
    }
    // crack lines run along the shard borders; the character follows the border's direction
    for (let r = 0, i = 0; r < rows; r++) for (let q = 0; q < cols; q++, i++) {
      const o = owner[i];
      const nb = (q + 1 < cols && owner[i + 1] !== o) ? owner[i + 1] : (r + 1 < rows && owner[i + cols] !== o) ? owner[i + cols] : -1;
      if (nb < 0) continue;
      const vx = seeds[nb][0] - seeds[o][0], vy = seeds[nb][1] - seeds[o][1];
      let a = Math.atan2(vx, -vy); if (a < 0) a += Math.PI;          // border direction, 0..pi
      const ch = a < Math.PI / 8 || a > Math.PI * 7 / 8 ? "_" : a < Math.PI * 3 / 8 ? "\\" : a < Math.PI * 5 / 8 ? "|" : "/";
      crackCh[i] = ch.charCodeAt(0);
      crackT[i] = Math.hypot((q + .5) * cw - ox, (r + .5) * lh - oy) / maxD * .55 + noise[i] * .05;
    }
    // shards nearest the corner fall first
    const dropAt = seeds.map(([x, y]) => .5 + Math.hypot(x - ox, y - oy) / maxD * .8 + rand() * .08);
    const dropped = new Uint8Array(seeds.length), parts = [];
    let ends = 0; for (const t of dropAt) ends = Math.max(ends, t);
    ends += .3;

    const CRUMBLE = ".:;'`";
    const row = new Uint16Array(cols), rowL = new Uint16Array(cols);
    const t0 = performance.now();
    let soundCount = 0;
    rumble();

    (function frame(now) {
      if (!overlay) return;
      const t = (now - t0) / 1000;
      c.clearRect(0, 0, W, H);
      // newly fallen shards: a crack sound and some debris
      for (let s = 0; s < seeds.length; s++) if (!dropped[s] && t >= dropAt[s]) {
        dropped[s] = 1;
        if (soundCount++ < 9) crackSound(1 + (soundCount % 3), 0, .5);
        if (parts.length < 160) for (let k = 0; k < 7; k++) {
          const [sx, sy] = seeds[s];
          parts.push({ x: sx + (rand() - .5) * 90, y: sy + (rand() - .5) * 50, vx: (rand() - .5) * 1.6, vy: -rand() * 1.5, ch: "/\\|_.,'"[(rand() * 7) | 0], a: 1 });
        }
      }
      // void where shards have fallen (with a faint starfield so it reads on dark pages)
      c.fillStyle = "#000";
      for (let r = 0; r < rows; r++) {
        let start = -1, i = r * cols;
        for (let q = 0; q <= cols; q++, i++) {
          const gone = q < cols && t > dropAt[owner[i]] + noise[i] * .1;
          if (gone && start < 0) start = q;
          if (!gone && start >= 0) { c.fillRect(start * cw, r * lh, (q - start) * cw + .5, lh + .5); start = -1; }
        }
      }
      // crack characters, crumbling edges and stars
      for (let r = 0; r < rows; r++) {
        let any = false, anyL = false, i = r * cols;
        for (let q = 0; q < cols; q++, i++) {
          const td = dropAt[owner[i]] + noise[i] * .1;
          let ch = 32, chL = 32;
          if (t > td) { if (noise[i] > .985) ch = 46; }                             // star in the void
          else if (t > td - .05 && noise[i] > .55) ch = CRUMBLE.charCodeAt((noise[i] * 5) | 0);    // crumbling edge
          else if (crackCh[i] && t > crackT[i]) {
            if (t < crackT[i] + .12) chL = crackCh[i]; else ch = crackCh[i];      // fresh cracks glow
          }
          row[q] = ch; rowL[q] = chL;
          if (ch !== 32) any = true; if (chL !== 32) anyL = true;
        }
        if (any) { c.fillStyle = t > ends - .3 ? "#555" : getFg(); c.fillText(String.fromCharCode.apply(null, row), 0, r * lh); }
        if (anyL) { c.fillStyle = getAccent(); c.fillText(String.fromCharCode.apply(null, rowL), 0, r * lh); }
      }
      // falling debris
      c.fillStyle = getFg();
      for (const p of parts) {
        if (p.a <= 0) continue;
        p.vy += .25; p.x += p.vx; p.y += p.vy; p.a -= .02;
        c.globalAlpha = Math.max(0, p.a); c.fillText(p.ch, p.x, p.y);
      }
      c.globalAlpha = 1;
      if (t < ends) requestAnimationFrame(frame);
      else { overlay.classList.add("dark"); cv.remove(); openArchive(); }
    })(t0);
  }
  const css = getComputedStyle(document.documentElement);
  const getFg = () => css.getPropertyValue("--fg").trim() || "#e8e6df";
  const getAccent = () => css.getPropertyValue("--accent").trim() || "#7cfc9a";

  function openArchive() {
    if (!overlay) return;
    overlay.classList.add("dark");
    const frame = document.createElement("iframe");
    frame.src = TARGET_URL; frame.title = "The ASCII Archive";
    frame.setAttribute("allow", "autoplay; fullscreen");
    let shown = false;
    const show = () => {
      if (shown || !overlay) return; shown = true;
      // if the archive isn't there (e.g. the site is still publishing), say so instead of showing a 404
      let ok = true;
      try { ok = !!frame.contentDocument.getElementById("c"); } catch (e) {}
      if (!ok) {
        frame.remove();
        const msg = document.createElement("div"); msg.className = "msg";
        msg.innerHTML = 'the wall broke, but nothing is behind it yet.\n\n<a href="' + HOME_URL + '">&lt;- back to prak.fun</a>';
        overlay.appendChild(msg); requestAnimationFrame(() => msg.style.opacity = 1);
        return;
      }
      frame.classList.add("in");
      try { frame.focus(); } catch (e) {}
    };
    frame.addEventListener("load", () => setTimeout(show, 200));
    setTimeout(show, 4000);
    overlay.appendChild(frame);
  }

  // the back button closes the archive and returns to Prak.fun
  addEventListener("popstate", () => {
    if (!overlay) return;
    overlay.remove(); overlay = null;
    document.title = oldTitle;
    const doc = document, ex = doc.exitFullscreen || doc.webkitExitFullscreen;
    if ((doc.fullscreenElement || doc.webkitFullscreenElement) && ex) try { quiet(ex.call(doc)); } catch (e) {}
    broken = false; stage = STAGES - 1; drawCorner(); setFlicker(); say("one more.");
  });
})();
</script>
