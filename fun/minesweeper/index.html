<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper · Prak.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e0c;--fg:#e8e6df;--dim:#6f6c63;--accent:#7cfc9a;--card:#151512;--bad:#ff6b6b;--warn:#ffd166;
        --n2:#6fb3ff;--n4:#c792ea;--n6:#4dd0e1}
  @media (prefers-color-scheme: light){:root{--bg:#f4f1e8;--fg:#1b1a17;--dim:#8a8578;--accent:#1f7a3a;--card:#ebe7dc;--bad:#c0392b;--warn:#b7791f;
        --n2:#1f5fbf;--n4:#7b3fb3;--n6:#0e7c86}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .top{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;font-size:13px;color:var(--dim)}
  .top a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--dim)}
  .top a:hover{color:var(--accent);border-color:var(--accent)}
  h1{font-size:22px;color:var(--accent);margin-bottom:4px;text-align:center}
  .sub{color:var(--dim);font-size:13px;text-align:center;margin-bottom:20px}
  .hud{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:14px;margin-bottom:16px;color:var(--dim)}
  .hud b{color:var(--fg);font-weight:400}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:1px dashed var(--dim);padding:6px 12px;cursor:pointer}
  button:hover,button:focus-visible{border-style:solid;border-color:var(--accent);color:var(--accent);outline:none}
  button.on{border-style:solid;border-color:var(--accent);color:var(--accent)}
  .help{margin-top:20px;font-size:12px;color:var(--dim);text-align:center;max-width:520px}
  .msg{min-height:1.5em;text-align:center;margin-top:12px;color:var(--accent)}
  .msg.bad{color:var(--bad)}

  #face{color:var(--fg)}
  #board{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .cell{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;
        font-size:calc(var(--cs) * .56);font-weight:700;cursor:pointer;background:var(--card);
        border:1px solid color-mix(in srgb,var(--dim) 35%,transparent);color:var(--dim);-webkit-touch-callout:none}
  .cell.hid:hover{border-color:var(--accent);color:var(--accent)}
  .cell.open{background:transparent;border-color:color-mix(in srgb,var(--dim) 12%,transparent);cursor:default}
  .cell.flag{color:var(--warn)}
  .cell.mine{color:var(--bad)}
  .cell.boom{background:var(--bad);color:var(--bg)}
  .cell.wrong{color:var(--bad);text-decoration:line-through}
  .n1{color:var(--accent)} .n2{color:var(--n2)} .n3{color:var(--bad)} .n4{color:var(--n4)}
  .n5{color:var(--warn)} .n6{color:var(--n6)} .n7{color:var(--fg)} .n8{color:var(--dim)}
</style>
</head>
<body>
<div class="top"><a href="../">&lt;- prak.fun</a><span>minesweeper.exe</span></div>
<h1>minesweeper</h1>
<p class="sub">numbers, logic, and one bad click.</p>
<div class="btns" style="margin:0 0 16px" id="levels">
  <button data-l="easy">[ easy ]</button>
  <button data-l="medium">[ medium ]</button>
  <button data-l="hard">[ hard ]</button>
</div>
<div class="hud">
  <span>mines <b id="mines">0</b></span>
  <span id="face">(•_•)</span>
  <span>time <b id="time">0</b></span>
  <span>best <b id="best">-</b></span>
</div>
<div id="board" role="grid" aria-label="minefield"></div>
<p class="msg" id="msg"></p>
<div class="btns">
  <button id="newBtn">[ new game ]</button>
  <button id="flagBtn">[ flag mode: off ]</button>
</div>
<p class="help">click to dig · right-click or long-press to flag · click a number whose flags are all placed to clear around it · first click is always safe</p>

<script>
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);
  const LEVELS = { easy: { c: 9, r: 9, m: 10 }, medium: { c: 16, r: 16, m: 40 }, hard: { c: 20, r: 20, m: 75 } };

  let level = store.get("prak.mines.level", "easy");
  if (!LEVELS[level]) level = "easy";

  let cols, rows, total, mines, isMine, isOpen, isFlag, adj, cells;
  let started, over, openCount, flags, t0, tick, boomAt, flagMode = false;
  const boardEl = $("board");

  function say(t, bad) { $("msg").textContent = t; $("msg").className = "msg" + (bad ? " bad" : ""); }

  function newGame() {
    clearInterval(tick);
    const L = LEVELS[level];
    cols = L.c; rows = L.r; total = cols * rows; mines = L.m;
    isMine = new Uint8Array(total); isOpen = new Uint8Array(total);
    isFlag = new Uint8Array(total); adj = new Uint8Array(total);
    started = false; over = false; openCount = 0; flags = 0; boomAt = -1;

    boardEl.innerHTML = "";
    cells = [];
    for (let i = 0; i < total; i++) {
      const d = document.createElement("div");
      d.dataset.i = i;
      d.setAttribute("role", "gridcell");
      boardEl.appendChild(d);
      cells.push(d);
    }
    boardEl.style.setProperty("--cols", cols);
    size();
    document.querySelectorAll("#levels button").forEach(b => b.classList.toggle("on", b.dataset.l === level));
    $("time").textContent = 0;
    $("face").textContent = "(•_•)";
    const b = store.get("prak.mines.best." + level, null);
    $("best").textContent = b === null ? "-" : b + "s";
    say("");
    render();
  }

  function size() {
    const avail = Math.min(document.documentElement.clientWidth - 32, 640);
    const cs = Math.max(14, Math.min(32, Math.floor((avail - (cols - 1) * 2) / cols)));
    boardEl.style.setProperty("--cs", cs + "px");
  }

  function nbrs(i) {
    const x = i % cols, y = (i / cols) | 0, out = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < cols && ny < rows) out.push(ny * cols + nx);
      }
    return out;
  }

  function placeMines(safe) {
    let banned = new Set([safe, ...nbrs(safe)]);
    if (total - banned.size < mines) banned = new Set([safe]);
    const pool = [];
    for (let i = 0; i < total; i++) if (!banned.has(i)) pool.push(i);
    for (let k = 0; k < mines; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      isMine[pool[k]] = 1;
    }
    for (let i = 0; i < total; i++) adj[i] = nbrs(i).reduce((s, n) => s + isMine[n], 0);
  }

  function open(i) {
    if (over || isOpen[i] || isFlag[i]) return;
    if (!started) {
      placeMines(i); started = true; t0 = Date.now();
      tick = setInterval(() => { $("time").textContent = elapsed(); }, 250);
    }
    if (isMine[i]) return lose(i);
    const stack = [i];
    while (stack.length) {
      const j = stack.pop();
      if (isOpen[j] || isFlag[j]) continue;
      isOpen[j] = 1; openCount++;
      if (adj[j] === 0) for (const n of nbrs(j)) if (!isOpen[n]) stack.push(n);
    }
    if (openCount === total - mines) win();
  }

  function chord(i) {
    if (!isOpen[i] || adj[i] === 0) return;
    const ns = nbrs(i);
    if (ns.filter(n => isFlag[n]).length !== adj[i]) return;
    for (const n of ns) { open(n); if (over) return; }
  }

  function toggleFlag(i) {
    if (over || isOpen[i]) return;
    isFlag[i] ^= 1;
    flags += isFlag[i] ? 1 : -1;
    render();
  }

  const elapsed = () => Math.min(999, Math.floor((Date.now() - t0) / 1000));

  function lose(i) {
    over = true; boomAt = i; clearInterval(tick);
    $("face").textContent = "(x_x)";
    say("boom. hit [ new game ] to try again", true);
  }

  function win() {
    over = true; clearInterval(tick);
    for (let i = 0; i < total; i++) if (isMine[i]) isFlag[i] = 1;
    flags = mines;
    const t = elapsed();
    $("time").textContent = t;
    $("face").textContent = "(^_^)";
    const key = "prak.mines.best." + level, b = store.get(key, null);
    if (b === null || t < b) { store.set(key, t); $("best").textContent = t + "s"; say(`cleared in ${t}s · new best!`); }
    else say(`cleared in ${t}s`);
  }

  function render() {
    for (let i = 0; i < total; i++) {
      const el = cells[i];
      let cls = "cell", txt = "";
      if (isOpen[i]) {
        cls += " open";
        if (adj[i]) { txt = adj[i]; cls += " n" + adj[i]; }
      } else if (over && boomAt >= 0 && isMine[i] && !isFlag[i]) {
        cls += " open mine" + (i === boomAt ? " boom" : ""); txt = "*";
      } else if (over && boomAt >= 0 && isFlag[i] && !isMine[i]) {
        cls += " wrong"; txt = "!";
      } else if (isFlag[i]) {
        cls += " flag"; txt = "!";
      } else {
        cls += " hid"; txt = "#";
      }
      el.className = cls;
      el.textContent = txt;
    }
    $("mines").textContent = mines - flags;
  }

  // ---- input ----
  let lpTimer = null, lpFired = false, lastPointer = "mouse", px = 0, py = 0;
  const cellIndex = e => { const c = e.target.closest(".cell"); return c ? +c.dataset.i : -1; };

  boardEl.addEventListener("pointerdown", e => {
    lastPointer = e.pointerType; lpFired = false;
    const i = cellIndex(e);
    if (i < 0 || over) return;
    if (e.button === 0 && !isOpen[i]) $("face").textContent = "(o_o)";
    if (e.pointerType === "touch") {
      px = e.clientX; py = e.clientY;
      lpTimer = setTimeout(() => {
        lpFired = true; toggleFlag(i);
        if (navigator.vibrate) navigator.vibrate(15);
      }, 380);
    }
  });
  boardEl.addEventListener("pointermove", e => {
    if (lpTimer && Math.hypot(e.clientX - px, e.clientY - py) > 10) { clearTimeout(lpTimer); lpTimer = null; }
  });
  const endPress = () => {
    clearTimeout(lpTimer); lpTimer = null;
    if (!over) $("face").textContent = "(•_•)";
  };
  boardEl.addEventListener("pointerup", endPress);
  boardEl.addEventListener("pointercancel", endPress);
  boardEl.addEventListener("pointerleave", endPress);

  boardEl.addEventListener("click", e => {
    if (lpFired) { lpFired = false; return; }
    const i = cellIndex(e);
    if (i < 0 || over) return;
    if (isOpen[i]) chord(i);
    else if (flagMode) toggleFlag(i);
    else open(i);
    render();
  });
  boardEl.addEventListener("contextmenu", e => {
    e.preventDefault();
    if (lastPointer === "touch") return;
    const i = cellIndex(e);
    if (i >= 0) toggleFlag(i);
  });

  $("newBtn").addEventListener("click", newGame);
  $("flagBtn").addEventListener("click", () => {
    flagMode = !flagMode;
    $("flagBtn").textContent = `[ flag mode: ${flagMode ? "on" : "off"} ]`;
    $("flagBtn").classList.toggle("on", flagMode);
  });
  document.querySelectorAll("#levels button").forEach(b => b.addEventListener("click", () => {
    level = b.dataset.l; store.set("prak.mines.level", level); newGame();
  }));
  document.addEventListener("keydown", e => {
    if (e.key === "n" || e.key === "N") newGame();
    if (e.key === "f" || e.key === "F") $("flagBtn").click();
  });
  window.addEventListener("resize", size);

  newGame();
</script>
</body>
</html>
