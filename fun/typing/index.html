<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Racer · Prak.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e0c;--fg:#e8e6df;--dim:#6f6c63;--accent:#7cfc9a;--card:#151512;--bad:#ff6b6b;--warn:#ffd166}
  @media (prefers-color-scheme: light){:root{--bg:#f4f1e8;--fg:#1b1a17;--dim:#8a8578;--accent:#1f7a3a;--card:#ebe7dc;--bad:#c0392b;--warn:#b7791f}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .top{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;font-size:13px;color:var(--dim)}
  .top a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--dim)}
  .top a:hover{color:var(--accent);border-color:var(--accent)}
  h1{font-size:22px;color:var(--accent);margin-bottom:4px;text-align:center}
  .sub{color:var(--dim);font-size:13px;text-align:center;margin-bottom:20px}
  .hud{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:14px;margin-bottom:16px;color:var(--dim)}
  .hud b{color:var(--fg);font-weight:400}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:1px dashed var(--dim);padding:6px 12px;cursor:pointer}
  button:hover,button:focus-visible{border-style:solid;border-color:var(--accent);color:var(--accent);outline:none}
  button.on{border-style:solid;border-color:var(--accent);color:var(--accent)}
  .help{margin-top:20px;font-size:12px;color:var(--dim);text-align:center;max-width:520px}

  .wrap{position:relative;width:100%;max-width:720px}
  #text{background:var(--card);border:1px dashed var(--dim);padding:20px;font-size:clamp(16px,4.2vw,21px);line-height:1.8;cursor:text;min-height:9em;word-break:normal}
  #text.focus{border-style:solid;border-color:var(--accent)}
  #text .t{color:var(--dim)}
  #text .ok{color:var(--fg)}
  #text .no{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
  #text .cur{box-shadow:inset 2px 0 0 var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{box-shadow:none}}
  .word{white-space:nowrap}
  #blur{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
        background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--accent);cursor:pointer;font-size:14px}
  #blur.show{display:flex}
  #inp{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
  #result{white-space:pre;font-size:14px;margin-top:20px;min-height:4.5em;text-align:left;color:var(--dim);overflow-x:auto;max-width:100%}
  #result b{color:var(--accent);font-weight:400}
</style>
</head>
<body>
<div class="top"><a href="../">&lt;- prak.fun</a><span>typeracer.exe</span></div>
<h1>type racer</h1>
<p class="sub">how fast can you actually type?</p>
<div class="btns" style="margin:0 0 16px" id="modes">
  <button data-n="10">[ 10 words ]</button>
  <button data-n="25">[ 25 words ]</button>
  <button data-n="50">[ 50 words ]</button>
</div>
<div class="hud">
  <span>wpm <b id="wpm">0</b></span>
  <span>accuracy <b id="acc">100%</b></span>
  <span>time <b id="time">0.0s</b></span>
  <span>best <b id="best">-</b></span>
</div>
<div class="wrap">
  <div id="text" aria-label="text to type"></div>
  <div id="blur">[ click here to keep typing ]</div>
  <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="type here">
</div>
<div id="result"></div>
<div class="btns"><button id="restart">[ new text ]</button></div>
<p class="help">just start typing — the timer starts on your first key · tab or esc for a new text</p>

<script>
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);

  const WORDS = ("the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will " +
    "there say who make when can more if no man out other so what time up go about than into could state only new year some take come these " +
    "know see use get like then first any work now may such give over think most even find day also after way many must look before great back " +
    "through long where much should well people down own just because good each those feel seem how high too place little world very still " +
    "hand old life tell write become here show house both between need mean call under last right move thing general school never same another " +
    "begin while number part turn real leave might want point form off child few small since against ask late home interest large person end " +
    "open public follow during present without again hold around possible head consider word program problem however lead system set order eye " +
    "plan run keep face fact group play stand increase early course change help line light power water city build drone chip circuit signal").split(" ");

  const textEl = $("text"), inp = $("inp"), blur = $("blur");
  let n = store.get("prak.type.mode", 25);
  if (![10, 25, 50].includes(n)) n = 25;
  let target, typed, startT, done, keys, errs, timerId;

  function makeText() {
    const out = [];
    while (out.length < n) {
      const w = WORDS[(Math.random() * WORDS.length) | 0];
      if (w !== out[out.length - 1]) out.push(w);
    }
    return out.join(" ");
  }

  function restart() {
    clearInterval(timerId);
    target = makeText(); typed = ""; startT = null; done = false; keys = 0; errs = 0;
    inp.value = ""; inp.maxLength = target.length;
    $("result").innerHTML = "";
    document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", +b.dataset.n === n));
    const b = store.get("prak.type.best." + n, null);
    $("best").textContent = b === null ? "-" : b;
    stats(); render();
    inp.focus();
  }

  function esc(c) { return c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c; }

  function render() {
    let html = "", i = 0;
    for (const word of target.split(" ")) {
      html += '<span class="word">';
      for (const ch of word) html += charSpan(i++, ch);
      html += "</span>";
      if (i < target.length) html += charSpan(i++, " ");
    }
    textEl.innerHTML = html;
  }

  function charSpan(i, ch) {
    let cls = i < typed.length ? (typed[i] === ch ? "ok" : "no") : "t";
    if (i === typed.length && !done) cls += " cur";
    const shown = ch === " " && cls.startsWith("no") ? "_" : esc(ch);
    return `<span class="${cls}">${shown}</span>`;
  }

  function correctCount() { let c = 0; for (let i = 0; i < typed.length; i++) if (typed[i] === target[i]) c++; return c; }

  function stats() {
    const secs = startT ? (performance.now() - startT) / 1000 : 0;
    const wpm = secs > 0.5 ? Math.round(correctCount() / 5 / (secs / 60)) : 0;
    const acc = keys ? Math.round(((keys - errs) / keys) * 100) : 100;
    $("wpm").textContent = wpm;
    $("acc").textContent = acc + "%";
    $("time").textContent = secs.toFixed(1) + "s";
    return { wpm, acc, secs };
  }

  function bar(v, max) {
    const W = 24, f = Math.max(0, Math.min(W, Math.round((v / max) * W)));
    return "[" + "#".repeat(f) + ".".repeat(W - f) + "]";
  }

  function finish() {
    done = true; clearInterval(timerId);
    const { wpm, acc, secs } = stats();
    render();
    const key = "prak.type.best." + n, b = store.get(key, null);
    let note = "";
    if (b === null || wpm > b) { store.set(key, wpm); $("best").textContent = wpm; note = "  <b>new best!</b>"; }
    $("result").innerHTML =
      `wpm       ${bar(wpm, 150)} <b>${wpm}</b>${note}\n` +
      `accuracy  ${bar(acc, 100)} <b>${acc}%</b>\n` +
      `time      ${secs.toFixed(1)}s · ${n} words · press tab to go again`;
  }

  inp.addEventListener("input", () => {
    if (done) { inp.value = typed; return; }
    let v = inp.value.slice(0, target.length);
    if (!startT && v.length) { startT = performance.now(); timerId = setInterval(stats, 100); }
    for (let i = typed.length; i < v.length; i++) { keys++; if (v[i] !== target[i]) errs++; }
    typed = v; inp.value = v;
    render(); stats();
    if (typed.length === target.length) finish();
  });
  inp.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) e.preventDefault();
    if (e.key === "Tab") { e.preventDefault(); restart(); }
  });
  inp.addEventListener("paste", e => e.preventDefault());
  inp.addEventListener("focus", () => { textEl.classList.add("focus"); blur.classList.remove("show"); });
  inp.addEventListener("blur", () => { textEl.classList.remove("focus"); if (!done) blur.classList.add("show"); });
  textEl.addEventListener("click", () => inp.focus());
  blur.addEventListener("click", () => inp.focus());
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); restart(); }
    else if (e.key === "Tab" && done) { e.preventDefault(); restart(); }
  });
  $("restart").addEventListener("click", restart);
  document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => {
    n = +b.dataset.n; store.set("prak.type.mode", n); restart();
  }));

  restart();
</script>
</body>
</html>
